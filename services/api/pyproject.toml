[tool.poetry]
name = "grahvani-api"
version = "1.0.0"
description = "Grahvani — FastAPI modular monolith backend for Vedic astrology SaaS"
authors = ["Grahvani Engineering <dev@grahvani.app>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"

# Web Framework
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}

# Data Validation & Settings
pydantic = "^2.8.0"
pydantic-settings = "^2.4.0"

# Database
sqlalchemy = {extras = ["asyncio"], version = "^2.0.36"}
asyncpg = "^0.29.0"
alembic = "^1.13.0"
pgvector = "^0.3.0"

# Redis & Task Queue
redis = {extras = ["hiredis"], version = "^5.0.0"}
dramatiq = {extras = ["redis"], version = "^1.17.0"}
apscheduler = "^3.10.0"

# Authentication
firebase-admin = "^6.5.0"

# AI / LLM
google-genai = "^1.0.0"
langfuse = "^4.0.0"

# Astrology Engine
pyswisseph = "^2.10.3"

# HTTP Client
httpx = "^0.27.0"

# Utilities
python-multipart = "^0.0.9"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}

# PDF & Storage
weasyprint = "^62.0"
Jinja2 = "^3.1.4"
boto3 = "^1.35.0"

# Observability
sentry-sdk = {extras = ["fastapi"], version = "^2.13.0"}
watchtower = "^3.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
httpx = "^0.27.0"
testcontainers = {extras = ["postgresql"], version = "^4.8.0"}
ruff = "^0.6.0"
mypy = "^1.11.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
