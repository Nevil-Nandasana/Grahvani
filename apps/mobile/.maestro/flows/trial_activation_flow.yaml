# 3. Execute 7-Day Free Premium Trial Activation CTA Tap
- tapOn: "Start 7-Day Free Premium Trial"

# 4. Verify Immediate Entitlement Status Update & Banner State
- assertVisible: "7-Day Premium Trial Active"
- assertVisible: "7 days remaining"
