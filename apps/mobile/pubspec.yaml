name: grahvani
description: Production-grade Vedic astrology app combining Swiss Ephemeris calculation with grounded RAG AI interpretation.
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Local Storage (Drift SQLite)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Authentication
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.3
  google_sign_in: ^6.2.1

  # Networking
  dio: ^5.6.0
  url_launcher: ^6.3.0

  # Firebase Cloud Messaging (Push Notifications)
  firebase_messaging: ^15.1.0

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  intl: ^0.20.2

  # In-App Purchase (Google Play + App Store)
  in_app_purchase: ^3.1.13

  # Voice AI (STT + TTS)
  speech_to_text: ^6.6.2
  flutter_tts: ^3.8.5

  # Security Hardening
  freerasp: ^6.3.0
  flutter_windowmanager: ^0.2.0

  # Code generation
  freezed_annotation: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  json_annotation: ^4.9.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
